<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Scrivener</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070606; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #e7e0cc; image-rendering: auto; }

    /* credits: a quiet link outside the canvas, and a sheet listing every attribution */
    #credits-link {
      position: fixed; right: 12px; bottom: 8px; z-index: 2;
      font: italic 13px "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: 0.04em;
      color: #8d846f; text-decoration: none; padding: 3px 8px; border-radius: 2px; background: rgba(7, 6, 6, 0.55);
    }
    #credits-link:hover, #credits-link:focus-visible { color: #e7e0cc; outline: 1px solid #5a5446; }
    #credits {
      width: min(760px, calc(100vw - 32px)); max-height: min(80vh, 760px); padding: 0;
      border: 1px solid #3b362d; background: #e7e0cc; color: #15130f;
      font: 15px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
    }
    #credits::backdrop { background: rgba(7, 6, 6, 0.72); }
    #credits header {
      position: sticky; top: 0; display: flex; align-items: baseline; justify-content: space-between;
      padding: 18px 22px 10px; background: #e7e0cc; border-bottom: 1px solid #c9bfa5;
    }
    #credits h2 { margin: 0; font: 22px "Big Caslon", "Iowan Old Style", Palatino, Georgia, serif; letter-spacing: 0.22em; }
    #credits .credits-close {
      font: inherit; font-size: 13px; letter-spacing: 0.08em; background: none; border: 1px solid #8d846f;
      color: #15130f; padding: 3px 10px; cursor: pointer;
    }
    #credits .credits-body { padding: 6px 22px 20px; overflow-wrap: anywhere; }
    #credits h3 { margin: 18px 0 6px; font: 12px Cochin, "Iowan Old Style", Palatino, serif; letter-spacing: 0.28em; text-transform: uppercase; color: #6d1d14; }
    #credits ul { margin: 0; padding-left: 18px; }
    #credits li { margin: 3px 0; font-size: 14px; }
    #credits ul.cc0 li { font-size: 13px; }
    #credits a { color: #6d1d14; }
    #credits details { margin-top: 18px; }
    #credits summary { cursor: pointer; font-size: 14px; }
    #credits .small { margin-top: 18px; font-size: 12.5px; color: #4a443b; font-style: italic; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="The Scrivener: AI challengers duel an ink-drawn boss"></canvas>
  <a id="credits-link" href="assets/audio/LICENSES.md" title="Credits (C)">Credits</a>
  <dialog id="credits" aria-labelledby="credits-title">
    <header>
      <h2 id="credits-title">CREDITS</h2>
      <button type="button" class="credits-close" aria-label="Close credits">CLOSE</button>
    </header>
    <div class="credits-body">
      <p>The Scrivener: an original boss, drawn in code. Challengers: Claude and GPT, through OpenRouter.</p>
    </div>
  </dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
