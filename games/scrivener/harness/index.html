<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Scrivener: harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070606; color: #9c9483; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #stage { width: min(100vw, calc((100vh - 34px) * 16 / 9)); aspect-ratio: 16 / 9; }
    body.bare #stage { width: 100vw; height: 100vh; aspect-ratio: auto; }
    body.bare #dev { display: none; }
    #dev { height: 20px; white-space: nowrap; overflow: hidden; max-width: 96vw; text-overflow: ellipsis; }
    #dev b { color: #e7e0cc; font-weight: 600; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="dev">connecting</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
