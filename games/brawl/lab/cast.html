<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cast options</title>
<style>
  html, body { margin: 0; background: #141318; color: #e6e4de; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  #sheet { width: 1920px; margin: 0 auto; }
  header { height: 60px; display: flex; align-items: flex-end; padding: 0 40px; box-sizing: border-box; }
  header h1 { font-size: 26px; font-weight: 400; margin: 0; letter-spacing: 0.04em; }
  header span { margin-left: auto; font-size: 15px; color: #8d8b87; }
  .row { height: 440px; display: grid; grid-template-columns: 430px 760px 250px 1fr; border-top: 1px solid #2b2a30; }
  .row canvas { display: block; }
  .txt { padding: 54px 40px 0 10px; }
  .txt h2 { font-size: 38px; font-weight: 400; margin: 0 0 4px; }
  .txt .kind { font-size: 16px; color: #c5a559; margin-bottom: 14px; }
  .txt p { font-size: 17px; line-height: 1.4; margin: 0 0 14px; color: #d7d5cf; }
  .txt dl { margin: 0; font-size: 16px; line-height: 1.35; }
  .txt dt { color: #e6e4de; font-style: italic; margin-top: 8px; }
  .txt dd { margin: 0; color: #a9a7a2; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="ink.js"></script>
<script src="cast/demo.js" onerror="0"></script>
<script src="cast/bellringer.js" onerror="0"></script>
<script src="cast/gargoyle.js" onerror="0"></script>
<script src="cast/armour.js" onerror="0"></script>
<script src="cast/magpie.js" onerror="0"></script>
<script src="cast/wick.js" onerror="0"></script>
<script src="cast/hare.js" onerror="0"></script>
<script src="cast/hexer.js" onerror="0"></script>
<script src="cast/lamplighter.js" onerror="0"></script>
<script src="cast/angler.js" onerror="0"></script>
<script src="cast/chained.js" onerror="0"></script>
<script src="cast/mimic.js" onerror="0"></script>
<script src="cast/briar.js" onerror="0"></script>
<script src="cast/count.js" onerror="0"></script>
<script src="cast/wolf.js" onerror="0"></script>
<script src="cast/stitched.js" onerror="0"></script>
<script src="cast.js"></script>
</body>
</html>
