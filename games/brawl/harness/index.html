<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ringout harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05090f; color: #f4f8ff; overflow: hidden; }
      body { display: flex; flex-direction: column; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; }
      #stage { flex: 1 1 auto; min-height: 0; position: relative; }
      #dev { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #0b1522; font-size: 14px; flex-wrap: wrap; }
      #dev button { background: #2a3644; color: #f4f8ff; border: 0; padding: 4px 10px; font: inherit; cursor: pointer; }
      #dev button.on { background: #ffc21a; color: #0b1522; }
      #dev .sep { width: 1px; height: 18px; background: #3c4b5c; margin: 0 4px; }
      #dev #stats { min-width: 360px; font-variant-numeric: tabular-nums; }
      body.capture #dev { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="dev"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
